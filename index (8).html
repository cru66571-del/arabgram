<!DOCTYPE html>
<html lang="ru" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ArabGram</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#c4a88a">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="apple-touch-icon" href="icon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#c4a88a; --card:#f0e4d2; --ink:#2a1d14; --muted:#7a6350; --accent:#7a5a45;
  --me:#7a5a45; --me-ink:#f6ece0; --them:#f0e4d2; --line:#dccab2; --active:#e2d0b6;
}
:root[data-theme="dark"]{
  --bg:#0f1829; --card:#18243a; --ink:#e8eef7; --muted:#8ea2bd; --accent:#5b86ae;
  --me:#4a78a6; --me-ink:#fff; --them:#1f2f4a; --line:#26385a; --active:#22345a;
}
*{box-sizing:border-box;margin:0}
html,body{height:100%}
body{font-family:Manrope,system-ui,sans-serif;background:var(--bg);color:var(--ink);display:flex;justify-content:center;transition:background .3s}
[hidden]{display:none!important}
button,input{font:inherit;color:inherit}
button{background:none;border:0;cursor:pointer}
#shell{width:100%;max-width:480px;height:100dvh;position:relative;display:flex;flex-direction:column;overflow:hidden}
h1{font-size:28px;font-weight:800;padding:calc(env(safe-area-inset-top,0px) + 20px) 20px 12px}
#view{flex:1;overflow-y:auto;padding:0 16px 110px}
.card{background:var(--card);border-radius:22px;padding:6px 16px}
.row{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--line);width:100%;text-align:left}
.row:last-child{border-bottom:0}
.ava{width:44px;height:44px;border-radius:50%;background:var(--accent);color:#fff;display:grid;place-items:center;font-weight:800;flex:none;position:relative;margin:0 auto}
.row .ava,#chat header .ava{margin:0}
.dot{position:absolute;right:-1px;bottom:-1px;width:13px;height:13px;border-radius:50%;background:#4cc36b;border:2px solid var(--card)}
.cols{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;padding:8px 0}
.col{width:36px;height:36px;border-radius:50%;border:3px solid transparent}
.col.on{border-color:var(--ink)}
.on-t{color:#2f9e4f}
#pv{position:absolute;inset:0;background:var(--bg);z-index:6;overflow-y:auto;padding:calc(env(safe-area-inset-top,0px) + 12px) 16px 24px}
.fld{width:100%;margin-top:10px}
.grow{flex:1;min-width:0}
.name{font-weight:600}
.sub{color:var(--muted);font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.time{color:var(--muted);font-size:12px}
.empty{color:var(--muted);text-align:center;padding:40px 20px}
input[type=text],input[type=password],input[type=search]{width:100%;padding:14px 16px;border-radius:16px;border:0;background:var(--card);outline:2px solid transparent}
input:focus-visible,button:focus-visible{outline:2px solid var(--accent)}
.btn{background:var(--ink);color:var(--card);padding:13px 20px;border-radius:999px;font-weight:600}
.btn.ghost{background:var(--card);color:var(--ink)}
.chips{display:flex;flex-wrap:wrap;gap:8px;padding:12px 0}
.chip{background:var(--active);padding:9px 16px;border-radius:999px;font-size:14px}
.chip.on{background:var(--ink);color:var(--card)}
.set{display:flex;justify-content:space-between;align-items:center;padding:14px 0;border-bottom:1px solid var(--line)}
.sw{width:50px;height:30px;border-radius:999px;background:var(--active);position:relative;transition:background .2s}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:var(--card);box-shadow:0 1px 3px #0003;transition:transform .25s cubic-bezier(.34,1.56,.64,1)}
.sw.on{background:var(--accent)}.sw.on::after{transform:translateX(20px)}
#bar{position:absolute;left:16px;right:16px;bottom:calc(env(safe-area-inset-bottom,0px) + 14px);background:var(--card);border-radius:28px;display:flex;padding:6px;box-shadow:0 8px 24px #0002}
#bar button{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:9px 0;border-radius:22px;font-size:11px;color:var(--muted);transition:background .2s}
#bar button.on{background:var(--active);color:var(--ink)}
#bar svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
#bar button.on svg{animation:spring .5s cubic-bezier(.34,1.56,.64,1)}
@keyframes spring{from{transform:scale(.6)}to{transform:scale(1)}}
#auth{margin:auto;width:100%;padding:24px;display:flex;flex-direction:column;gap:12px;text-align:center}
#auth .logo{width:84px;height:84px;margin:0 auto 8px;border-radius:24px;background:var(--card);display:grid;place-items:center;font-size:30px;letter-spacing:4px;color:var(--accent)}
#err{color:#8a2d1d;font-size:14px;min-height:20px}
#chat{position:absolute;inset:0;background:var(--bg);display:flex;flex-direction:column;z-index:5}
#chat header{display:flex;align-items:center;gap:12px;padding:calc(env(safe-area-inset-top,0px) + 12px) 16px 12px}
#msgs{flex:1;overflow-y:auto;padding:8px 16px;display:flex;flex-direction:column;gap:6px}
.b{max-width:78%;padding:9px 14px;border-radius:18px;background:var(--them);word-wrap:break-word;white-space:pre-wrap}
.b.me{align-self:flex-end;background:var(--me);color:var(--me-ink)}
#send{display:flex;gap:8px;padding:10px 16px calc(env(safe-area-inset-bottom,0px) + 12px)}
#send .btn{width:46px;height:46px;padding:0;display:grid;place-items:center;flex:none}
.a0{animation:a0 .22s ease-out}.a1{animation:a1 .45s cubic-bezier(.34,1.56,.64,1)}.a2{animation:a2 .5s}
.a3{animation:a3 .55s}.a4{animation:a4 .3s ease-out}.a5{animation:a5 .4s}
@keyframes a0{from{opacity:0;transform:translateY(12px) scale(.96)}}
@keyframes a1{from{opacity:0;transform:scale(.5)}}
@keyframes a2{0%{opacity:0;transform:translateY(30px)}60%{opacity:1;transform:translateY(-8px)}80%{transform:translateY(3px)}}
@keyframes a3{0%{transform:scale(.6,1.3)}40%{transform:scale(1.2,.85)}70%{transform:scale(.95,1.05)}}
@keyframes a4{from{opacity:0;transform:translateX(60px)}}
@keyframes a5{from{opacity:0;filter:blur(4px)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

:root{--ga:42%;--gb:22px;
  --blobs:radial-gradient(circle at 15% 8%,#f0a96a 0,transparent 34%),radial-gradient(circle at 92% 40%,#a9cbe6 0,transparent 36%),radial-gradient(circle at 20% 92%,#d98b6a 0,transparent 38%),radial-gradient(circle at 80% 95%,#f3d9a8 0,transparent 30%)}
:root[data-theme="dark"]{
  --blobs:radial-gradient(circle at 15% 8%,#3b6aa8 0,transparent 36%),radial-gradient(circle at 92% 40%,#7a4fa8 0,transparent 36%),radial-gradient(circle at 20% 92%,#1f8aa8 0,transparent 38%),radial-gradient(circle at 80% 95%,#a84f7a 0,transparent 30%)}
#shell::before{content:"";position:absolute;inset:-10%;z-index:0;pointer-events:none;background:var(--blobs);animation:drift 18s ease-in-out infinite alternate}
@keyframes drift{from{transform:translate(0,0) scale(1)}to{transform:translate(-4%,3%) scale(1.12)}}
#chat,#pv{background:var(--blobs),var(--bg)!important}
#app{position:relative;z-index:1}
.card,#bar,.b,#chat header,#gs,input[type=text],input[type=password],input[type=search],input[type=number],.btn.ghost,.chip,.mini,.gi{
  background:color-mix(in srgb,var(--card) var(--ga),transparent);
  -webkit-backdrop-filter:blur(var(--gb)) saturate(1.9) brightness(1.06);backdrop-filter:blur(var(--gb)) saturate(1.9) brightness(1.06);
  border:1px solid rgba(255,255,255,.38);
  box-shadow:inset 0 1px 1px rgba(255,255,255,.7),inset 0 -1px 1px rgba(255,255,255,.18),0 8px 22px rgba(0,0,0,.10)}
#chat header{margin:0 10px;border-radius:22px;padding:10px 12px}
#bar{box-shadow:0 10px 28px #0003,inset 0 1px 1px rgba(255,255,255,.7),inset 0 -1px 1px rgba(255,255,255,.18)}
.b.me{background:color-mix(in srgb,var(--me) 82%,transparent);border-color:rgba(255,255,255,.22)}
.chip.on{background:var(--ink);color:var(--card)}
#bar button.on{background:color-mix(in srgb,#fff 38%,transparent);box-shadow:inset 0 1px 1px rgba(255,255,255,.8)}
#send input{border-radius:999px}
#gs{border-radius:26px 26px 0 0;max-height:78dvh;overflow-y:auto;padding:16px 16px calc(env(safe-area-inset-bottom,0px) + 16px);position:absolute;left:0;right:0;bottom:0;z-index:7}
input[type=range]{width:100%;accent-color:var(--accent)}
input[type=number]{padding:8px;border-radius:12px;color:var(--ink);width:84px}
.mini{padding:7px 12px;border-radius:12px;font-weight:600}
.b.gift{font-size:20px;text-align:center;background:linear-gradient(135deg,#f6d27a,#e8a94a)!important;color:#3a2a1a;border:0}
.gg{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.gi{border-radius:18px;padding:12px 4px;text-align:center}
.gi b{display:block;font-size:30px}
.b.media{padding:4px;max-width:72%}
.b.media img{display:block;max-width:100%;max-height:320px;border-radius:14px;cursor:zoom-in}
.b audio{max-width:230px;height:40px;display:block}
#send .btn.rec{background:#c0392b!important;color:#fff;width:auto;padding:0 14px;font-size:14px}
.vb{display:inline-grid;place-items:center;width:16px;height:16px;border-radius:50%;background:#2f8fe0;color:#fff;font-size:10px;margin-left:5px;vertical-align:middle}
.sb{background:#c0392b;color:#fff;border-radius:6px;font-size:10px;padding:1px 5px;margin-left:5px;vertical-align:middle;font-weight:800}
#ann{display:flex;gap:10px;align-items:center;margin:0 16px 10px;padding:12px 14px;font-size:14px}
#bar button{position:relative}
.bdg{position:absolute;top:2px;right:22%;min-width:18px;height:18px;border-radius:9px;background:#e0245e;color:#fff;font-size:11px;font-style:normal;display:grid;place-items:center;padding:0 5px;font-weight:700}
.ub{background:#e0245e;color:#fff;border-radius:10px;min-width:20px;height:20px;display:inline-grid;place-items:center;font-size:12px;padding:0 6px;font-weight:700}
.tick{font-size:11px;opacity:.75;margin-left:8px}
.tick.rd{color:#7fd0ff;opacity:1}
.quote{font-size:12px;opacity:.9;border-left:3px solid var(--accent);padding:2px 8px;margin-bottom:4px;border-radius:4px;background:rgba(127,127,127,.15)}
#rbar{display:flex;gap:10px;align-items:center;margin:0 16px 6px;padding:8px 12px}
#bar{position:relative;isolation:isolate}
#pill{position:absolute;top:6px;bottom:6px;left:6px;width:calc((100% - 12px) / 4);border-radius:22px;z-index:0;pointer-events:none;
  background:color-mix(in srgb,#fff 42%,transparent);
  box-shadow:inset 0 1px 1px rgba(255,255,255,.85),inset 0 -1px 2px rgba(255,255,255,.25),0 4px 14px rgba(0,0,0,.12);
  -webkit-backdrop-filter:blur(8px) saturate(1.8);backdrop-filter:blur(8px) saturate(1.8);
  transition:transform .5s cubic-bezier(.3,1.5,.5,1)}
#pill.stretch{animation:stretch .5s ease}
@keyframes stretch{0%{scale:1 1}35%{scale:1.22 .9}100%{scale:1 1}}
#bar button{position:relative;z-index:1}
#bar button.on{background:none!important;box-shadow:none!important}
#view{touch-action:pan-y}
.swL{animation:swL .38s cubic-bezier(.2,.9,.3,1)}
.swR{animation:swR .38s cubic-bezier(.2,.9,.3,1)}
@keyframes swL{from{opacity:0;transform:translateX(48px) scale(.98)}}
@keyframes swR{from{opacity:0;transform:translateX(-48px) scale(.98)}}
.chatIn{animation:chatIn .35s cubic-bezier(.2,.9,.3,1)}
@keyframes chatIn{from{opacity:0;transform:translateX(44px)}}
.nocopy .b,.nocopy .b *{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
.nocopy .b img{-webkit-user-drag:none}
.sub .tick.rd{color:#2f8fe0}
/* ---- водяное стекло: кнопки, переключатели, ползунки ---- */
.btn,.mini,.chip,.gi{position:relative;overflow:hidden;transition:transform .35s cubic-bezier(.3,1.6,.5,1),background .2s}
.btn:active,.mini:active,.chip:active,.gi:active,.cbtn:active{transform:scale(.94)}
.btn:not(.ghost){background-image:linear-gradient(180deg,rgba(255,255,255,.30),rgba(255,255,255,0) 55%);
  background-color:color-mix(in srgb,var(--ink) 82%,transparent);
  -webkit-backdrop-filter:blur(var(--gb)) saturate(1.8);backdrop-filter:blur(var(--gb)) saturate(1.8);
  border:1px solid rgba(255,255,255,.28);
  box-shadow:inset 0 1px 1px rgba(255,255,255,.55),inset 0 -2px 4px rgba(0,0,0,.18),0 6px 16px rgba(0,0,0,.18)}
.rip::after{content:"";position:absolute;left:var(--x,50%);top:var(--y,50%);width:10px;height:10px;margin:-5px;border-radius:50%;
  background:radial-gradient(circle,rgba(255,255,255,.75),rgba(255,255,255,0) 70%);animation:rip .6s ease-out forwards;pointer-events:none}
@keyframes rip{to{transform:scale(22);opacity:0}}
.row:active{background:color-mix(in srgb,#fff 28%,transparent)}
.sw{background:color-mix(in srgb,var(--active) 75%,transparent);box-shadow:inset 0 1px 3px rgba(0,0,0,.18);transition:background .25s}
.sw::after{background:linear-gradient(#fff,#efe7db);box-shadow:0 2px 6px rgba(0,0,0,.28),inset 0 1px 1px #fff;transition:transform .3s cubic-bezier(.3,1.6,.5,1),width .2s}
.sw:active::after{width:30px}
.sw.on:active::after{transform:translateX(14px)}
.sw.on{background:linear-gradient(180deg,rgba(255,255,255,.3),rgba(255,255,255,0)),var(--accent)}
input[type=range]{-webkit-appearance:none;appearance:none;height:28px;background:transparent}
input[type=range]::-webkit-slider-runnable-track{height:8px;border-radius:99px;background:color-mix(in srgb,var(--active) 80%,transparent);box-shadow:inset 0 1px 3px rgba(0,0,0,.2)}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:28px;height:28px;margin-top:-10px;border-radius:50%;background:linear-gradient(#fff,#efe7db);border:1px solid rgba(255,255,255,.7);box-shadow:0 3px 10px rgba(0,0,0,.3),inset 0 1px 1px #fff}
input[type=range]::-moz-range-track{height:8px;border-radius:99px;background:color-mix(in srgb,var(--active) 80%,transparent)}
input[type=range]::-moz-range-thumb{width:26px;height:26px;border-radius:50%;background:linear-gradient(#fff,#efe7db);border:1px solid #fff;box-shadow:0 3px 10px rgba(0,0,0,.3)}
/* ---- звонки ---- */
#call{position:absolute;inset:0;z-index:9;background:var(--blobs),var(--bg)!important;display:flex;flex-direction:column;align-items:center;justify-content:space-between;
  padding:calc(env(safe-area-inset-top,0px) + 70px) 20px calc(env(safe-area-inset-bottom,0px) + 40px)}
#rv{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;z-index:0;background:#000}
#call.audio #rv{display:none}
#lv{position:absolute;top:calc(env(safe-area-inset-top,0px) + 16px);right:16px;width:104px;height:144px;object-fit:cover;border-radius:20px;z-index:2;transform:scaleX(-1);border:1px solid rgba(255,255,255,.45);box-shadow:0 8px 24px #0005}
#cinfo{position:relative;z-index:1;text-align:center;display:flex;flex-direction:column;align-items:center;gap:8px}
#call.vid #cinfo{color:#fff;text-shadow:0 1px 8px #000a}
#call.vid #cinfo .sub{color:#fff}
#cctl{position:relative;z-index:1;display:flex;gap:18px}
.cbtn{width:66px;height:66px;border-radius:50%;font-size:26px;display:grid;place-items:center;color:var(--ink);
  background:color-mix(in srgb,var(--card) 55%,transparent);-webkit-backdrop-filter:blur(18px) saturate(1.8);backdrop-filter:blur(18px) saturate(1.8);
  border:1px solid rgba(255,255,255,.4);box-shadow:inset 0 1px 1px rgba(255,255,255,.7),0 8px 22px rgba(0,0,0,.25);transition:transform .35s cubic-bezier(.3,1.6,.5,1)}
.cbtn.red{background:#d6382b!important;color:#fff}
.cbtn.green{background:#2fa84f!important;color:#fff;animation:pulse 1.2s infinite}
.cbtn.off{opacity:.45}
@keyframes pulse{50%{transform:scale(1.1)}}
#toast{position:absolute;left:50%;bottom:120px;transform:translateX(-50%);z-index:10;padding:10px 18px;border-radius:999px;font-size:14px;
  background:color-mix(in srgb,var(--card) 88%,transparent);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);box-shadow:0 8px 24px #0004;max-width:90%;text-align:center}
</style>
</head>
<body>
<div id="shell">
  <section id="auth">
    <div class="logo">•••</div>
    <h1 style="padding:0">ArabGram</h1>
    <div style="display:flex;gap:8px;justify-content:center"><button class="chip on" id="mIn">Войти</button><button class="chip" id="mUp">Регистрация</button></div>
    <input id="u" type="text" placeholder="Имя пользователя (латиница, цифры, _)" autocomplete="username" autocapitalize="none">
    <div id="uhint" class="sub" style="min-height:18px"></div>
    <input id="dn0" type="text" placeholder="Имя для показа (необязательно)" maxlength="40" hidden>
    <input id="p" type="password" placeholder="Пароль" autocomplete="current-password">
    <input id="p2" type="password" placeholder="Повтори пароль" autocomplete="new-password" hidden>
    <div id="err" role="alert"></div>
    <button class="btn" id="go">Войти</button>
  </section>

  <div id="app" hidden style="display:flex;flex-direction:column;flex:1;min-height:0">
    <h1 id="title"></h1>
    <div id="ann" class="card" hidden></div>
    <main id="view"></main>
    <nav id="bar" aria-label="Разделы"></nav>
  </div>

  <section id="chat" hidden>
    <header>
      <button id="back" aria-label="Назад" class="btn ghost" style="padding:10px 16px">‹</button>
      <div id="chead" style="display:flex;align-items:center;gap:12px;flex:1;min-width:0;cursor:pointer">
        <span id="cava"></span><div class="grow"><div class="name" id="cname"></div><div class="sub" id="cst"></div></div>
      </div>
      <button id="callA" class="mini" aria-label="Голосовой звонок" hidden>📞</button>
      <button id="callV" class="mini" aria-label="Видеозвонок" hidden>🎥</button>
      <button id="pin" class="mini" aria-label="Закрепить чат" hidden>📌</button>
    </header>
    <div id="warn" class="card" hidden style="margin:6px 10px 0;padding:10px 14px;color:#c0392b;font-size:14px">⚠ Администрация отметила этого пользователя как мошенника. Не переводите деньги и не переходите по ссылкам.</div>
    <div id="msgs"></div>
    <div id="rbar" class="card" hidden><div id="rtxt" class="sub" style="flex:1"></div><button class="mini" id="rx" aria-label="Отменить ответ">✕</button></div>
    <form id="send">
      <button type="button" class="btn ghost" id="gbtn" aria-label="Подарок">🎁</button>
      <button type="button" class="btn ghost" id="pbtn" aria-label="Фото">📎</button>
      <input id="pfile" type="file" accept="image/*" hidden>
      <input id="text" type="text" placeholder="Сообщение" autocomplete="off">
      <button type="button" class="btn ghost" id="xbtn" aria-label="Отмена записи" hidden>✕</button>
      <button type="button" class="btn" id="mbtn" aria-label="Голосовое">🎤</button>
      <button class="btn" id="sbtn" aria-label="Отправить" hidden>➤</button>
    </form>
    <div id="nopost" class="sub" hidden style="text-align:center;padding:14px 16px calc(env(safe-area-inset-bottom,0px) + 14px)">Писать в канал может только владелец</div>
  </section>
  <section id="pv" hidden></section>
  <section id="gs" hidden></section>
  <section id="call" hidden>
    <video id="rv" autoplay playsinline></video>
    <video id="lv" autoplay muted playsinline hidden></video>
    <div id="cinfo"><div id="cava2"></div><div class="name" id="cn2" style="font-size:24px"></div><div class="sub" id="cs2"></div></div>
    <div id="cctl">
      <button class="cbtn" id="cmic" aria-label="Микрофон">🎙</button>
      <button class="cbtn" id="ccam" aria-label="Камера" hidden>📷</button>
      <button class="cbtn red" id="chup" aria-label="Завершить">📵</button>
      <button class="cbtn green" id="cacc" aria-label="Ответить" hidden>📞</button>
    </div>
  </section>
  <div id="toast" hidden></div>
</div>

<script>
(function(){
  var urls = [
    'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js',
    'https://fastly.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js',
    'https://gcore.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js',
    'https://unpkg.com/@supabase/supabase-js@2.45.4/dist/umd/supabase.js'
  ], i = 0;
  function boot(){ var s = document.createElement('script'); s.textContent = document.getElementById('app-code').textContent; document.body.appendChild(s); }
  function next(){
    if (window.supabase) return boot();
    if (i >= urls.length) return boot();
    var sc = document.createElement('script'); sc.src = urls[i++];

async function search(q){
  const base = q.replace(/^@/, '').replace(/[%,()]/g, '');
  const safe = base.replace(/_/g, '\\_');
  let ur = sb.from('profiles').select('*').neq('id', me.id).limit(30);
  if (safe) ur = ur.ilike('username', '%' + safe + '%');
  let cr1 = sb.from('chats').select('*').order('created_at', { ascending: false }).limit(10);
  let cr2 = safe ? sb.from('chats').select('*').ilike('handle', '%' + safe + '%').limit(10) : null;
  if (safe) cr1 = cr1.ilike('title', '%' + safe + '%');
  const [u, c1, c2] = await Promise.all([ur, cr1, cr2 || Promise.resolve({ data: [] })]);
  const users = u.data || [], seen = new Set(), chs = [];
  for (const x of [...(c2.data || []), ...(c1.data || [])]) if (!seen.has(x.id)){ seen.add(x.id); chs.push(x); }
  const res = $('#res'); if (!res || tab !== 'contacts') return;
  users.sort((a, b) => isOn(b) - isOn(a));
  const chRows = chs.map(x => `<button class="row" data-k="c" data-id="${x.id}">${ava(chatPeer(x))}
    <div class="grow"><div class="name">${x.kind === 'channel' ? '📢' : '👥'} ${esc(x.title)}</div><div class="sub">${x.handle ? '@' + esc(x.handle) + ' · ' : ''}${esc(x.description || (x.kind === 'channel' ? 'Канал' : 'Группа'))}</div></div></button>`).join('');
  const uRows = users.map(p => `<button class="row" data-k="u" data-id="${p.id}">${ava(p)}
    <div class="grow"><div class="name">${nm(p)}</div><div class="sub ${isOn(p)?'on-t':''}">@${esc(p.username)} · ${esc(status(p))}</div></div></button>`).join('');
  res.innerHTML = (chRows ? `<div class="sub" style="margin:0 4px 6px">Группы и каналы</div><div class="card">${chRows}</div>` : '')
    + (uRows ? `<div class="sub" style="margin:12px 4px 6px">Люди</div><div class="card">${uRows}</div>` : '')
    || '<div class="empty">Ничего не нашли</div>';
  res.onclick = e => { const b = e.target.closest('.row'); if (!b) return;
    if (b.dataset.k === 'c') enterChat(chs.find(x => x.id === b.dataset.id));
    else openChat(users.find(x => x.id === b.dataset.id)); };
}
async function enterChat(c){

  if (r.error) return alert(r.error.message);
  openChat(chatPeer(c));
}

function makePc(){
  const pc = new RTCPeerConnection({ iceServers: ICE });
  pc.onicecandidate = e => { if (e.candidate && call) sendSig('ice', e.candidate.toJSON()); };
  pc.ontrack = e => { const v = $('#rv'); v.srcObject = e.streams[0]; v.play && v.play().catch(() => {}); };
  pc.onconnectionstatechange = () => {
    if (!call) return;
    if (pc.connectionState === 'connected' && !call.t0){
      call.t0 = Date.now(); clearTimeout(call.timeout); callTxt('Идёт разговор · 0:00');
      call.tick = setInterval(() => { const t = Math.floor((Date.now() - call.t0) / 1000); callTxt('Идёт разговор · ' + Math.floor(t / 60) + ':' + String(t % 60).padStart(2, '0')); }, 1000);
    }
    if (pc.connectionState === 'failed') endCall('Не удалось соединиться. Для некоторых сетей нужен TURN-сервер.', true);
  };
  return pc;
}
async function getMedia(kind){
  try { return await navigator.mediaDevices.getUserMedia({ audio: true, video: kind === 'video' ? { facingMode: 'user' } : false }); }
  catch { toast('Нет доступа к микрофону' + (kind === 'video' ? ' или камере' : '') + '. Разреши в браузере (нужен https).'); return null; }
}
async function startCall(kind){
  if (!peer || peer.isChat || peer.fav || call) return;
  if (!window.RTCPeerConnection || !navigator.mediaDevices) return toast('Звонки не работают в этом браузере (нужен https)');
  const stream = await getMedia(kind); if (!stream) return;
  const { data: row, error } = await sb.from('calls').insert({ caller_id: me.id, callee_id: peer.id, kind }).select().single();
  if (error){ stream.getTracks().forEach(t => t.stop()); return toast(error.message + ' (выполни update7.sql в Supabase)'); }
  call = { id: row.id, peerId: peer.id, peer, kind, role: 'caller', stream, pc: null, queue: [], remoteSet: false, buf: [] };
  showCall(); callTxt('Звоним…'); $('#lv').srcObject = stream;
  call.pc = makePc(); stream.getTracks().forEach(t => call.pc.addTrack(t, stream));
  const offer = await call.pc.createOffer(); await call.pc.setLocalDescription(offer);
  await sendSig('offer', { type: offer.type, sdp: offer.sdp });
  call.timeout = setTimeout(() => { if (call && !call.t0) endCall('Нет ответа', true, 'missed'); }, 45000);
}
async function onIncoming(row){
  if (call){ sb.from('calls').update({ status: 'declined' }).eq('id', row.id); return; }
  const { data: pr } = await sb.from('profiles').select('*').eq('id', row.caller_id).single();
  if (call) return;
  call = { id: row.id, peerId: row.caller_id, peer: pr || { id: row.caller_id, display_name: 'Неизвестный' }, kind: row.kind, role: 'callee', stream: null, pc: null, queue: [], remoteSet: false, incoming: true, buf: sigBuf[row.id] || [] };
  delete sigBuf[row.id];
  showCall(); callTxt(row.kind === 'video' ? 'Входящий видеозвонок' : 'Входящий звонок');
  $('#cacc').hidden = false; $('#cmic').hidden = true; $('#ccam').hidden = true; $('#lv').hidden = true;
  startRing();
  if (S.notify && document.hidden && 'Notification' in window && Notification.permission === 'granted') showNote('📞 Входящий звонок', { body: call.peer.display_name, tag: 'call', icon: 'icon.svg', requireInteraction: true });
  call.timeout = setTimeout(() => { if (call && call.incoming) endCall('', true); }, 50000);
}
async function answerCall(){
  if (!call || !call.incoming) return;
  stopRing(); clearTimeout(call.timeout);
  const stream = await getMedia(call.kind); if (!stream) return endCall('', true);
  call.incoming = false; call.stream = stream; $('#lv').srcObject = stream;
  $('#cacc').hidden = true; $('#cmic').hidden = false; $('#ccam').hidden = call.kind !== 'video'; $('#lv').hidden = call.kind !== 'video';
  callTxt('Соединение…');
  call.pc = makePc(); stream.getTracks().forEach(t => call.pc.addTrack(t, stream));
  await sb.from('calls').update({ status: 'active' }).eq('id', call.id);
  for (const sg of call.buf.splice(0)) await handleSig(sg);
}
async function flushIce(){ for (const c of call.queue.splice(0)) { try { await call.pc.addIceCandidate(c); } catch {} } }
async function handleSig(sg){
  if (!call || sg.call_id !== call.id){ (sigBuf[sg.call_id] = sigBuf[sg.call_id] || []).push(sg); return; }
  if (!call.pc){ call.buf.push(sg); return; }
  const pc = call.pc;
  try {
    if (sg.type === 'offer'){
      await pc.setRemoteDescription(sg.payload); call.remoteSet = true;
      const ans = await pc.createAnswer(); await pc.setLocalDescription(ans);
      await sendSig('answer', { type: ans.type, sdp: ans.sdp }); await flushIce();
    } else if (sg.type === 'answer'){
      await pc.setRemoteDescription(sg.payload); call.remoteSet = true; await flushIce();
    } else if (sg.type === 'ice'){
      if (call.remoteSet) await pc.addIceCandidate(sg.payload); else call.queue.push(sg.payload);
    }
  } catch (e) { console.warn('signal', e); }
}
function onCallUpdate(r){
  if (!call || call.id !== r.id) return;
  if (['ended', 'declined', 'missed'].includes(r.status)) endCall(r.status === 'declined' ? 'Звонок отклонён' : '', false);
}
async function endCall(reason = '', tell = true, status = 'ended'){
  if (!call) return;
  const c = call; call = null;
  stopRing(); clearTimeout(c.timeout); clearInterval(c.tick);
  try { c.pc && c.pc.close(); } catch {}
  if (c.stream) c.stream.getTracks().forEach(t => t.stop());
  $('#rv').srcObject = null; $('#lv').srcObject = null; $('#call').hidden = true;
  const dur = c.t0 ? Math.round((Date.now() - c.t0) / 1000) : 0;
  if (tell) await sb.from('calls').update({ status: c.t0 ? 'ended' : (c.role === 'caller' ? status : 'declined') }).eq('id', c.id);
  if (c.role === 'caller'){
    const label = c.kind === 'video' ? '🎥 Видеозвонок' : '📞 Звонок';
    const body = c.t0 ? label + ' · ' + Math.floor(dur / 60) + ':' + String(dur % 60).padStart(2, '0') : label + ' не принят';
    const { data } = await sb.from('messages').insert({ sender_id: me.id, recipient_id: c.peerId, body }).select().single();
    if (data && peer && peer.id === c.peerId && !peer.isChat) addBubble(data);
    setTimeout(() => sb.from('calls').delete().eq('id', c.id), 4000);
  }
  if (reason) toast(reason);
}
$('#callA').onclick = () => startCall('audio');
$('#callV').onclick = () => startCall('video');
$('#chup').onclick = () => endCall('', true);
$('#cacc').onclick = answerCall;
$('#cmic').onclick = () => {
  if (!call || !call.stream) return;
  const t = call.stream.getAudioTracks(), on = !(t[0] && t[0].enabled);
  t.forEach(x => x.enabled = on); $('#cmic').classList.toggle('off', !on);
};
$('#ccam').onclick = () => {
  if (!call || !call.stream) return;
  const t = call.stream.getVideoTracks(), on = !(t[0] && t[0].enabled);
  t.forEach(x => x.enabled = on); $('#ccam').classList.toggle('off', !on);
};

applyTheme(); applyNoCopy(); start();
</script>
